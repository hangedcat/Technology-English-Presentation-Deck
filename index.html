<!doctype html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>第七組 CAD/CAE/CAM</title>
<style>
:root{
  --bg:#F4EFE3; --paper:#FBF8F1; --ink:#3A3833; --muted:#8E8878; --line:#CDC4AE;
  --gold:#BF8E22; --blue:#3A72CB; --red:#C0443B; --green:#4D9663;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#23221F; --paper:#2D2B27; --ink:#ECE6D8; --muted:#A39C8B; --line:#57524A;
    --gold:#E0AE45; --blue:#6E9BE6; --red:#E06A5F; --green:#74BC88; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#23221F; --paper:#2D2B27; --ink:#ECE6D8; --muted:#A39C8B; --line:#57524A;
  --gold:#E0AE45; --blue:#6E9BE6; --red:#E06A5F; --green:#74BC88; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;cursor:default}
body{font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Heiti TC",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center}
#svg{position:absolute;inset:0;width:1600px;height:900px;display:block;overflow:visible}
#svg text{font-family:inherit}
.o{transition:transform .8s cubic-bezier(.45,.05,.2,1),opacity .5s ease;transform-box:view-box;transform-origin:0 0}
.a{opacity:0;transform:translateY(14px) scale(.94);transition:opacity .45s ease,transform .6s cubic-bezier(.3,1.35,.5,1);transform-box:fill-box;transform-origin:center}
.a.on{opacity:1;transform:none}
.cell{opacity:0;transition:opacity .35s ease}
.on .cell{opacity:1}
.spin{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.a.stamp{transform:scale(1.8);transition:opacity .2s ease,transform .38s cubic-bezier(.5,1.6,.6,1)}
.a.stamp.on{transform:none}
.draw{transition:stroke-dashoffset 1.6s ease}
.on .draw{stroke-dashoffset:0!important}
.grow{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;transition:transform 1s cubic-bezier(.3,1,.4,1)}
.on .grow{transform:none}
.media{position:absolute;opacity:0;transition:opacity .5s ease;border-radius:12px;overflow:hidden;pointer-events:none}
.media.on{opacity:1}
.media img{width:100%;height:100%;object-fit:contain;display:block;background:var(--paper)}
.media .ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  background:var(--paper);color:var(--muted);font-size:24px;border:3px dashed var(--line);border-radius:12px;text-align:center;padding:20px}
.media .ph b{color:var(--ink);font-size:28px}
.media.missing img{display:none}
.media.missing .ph{display:flex}
.panel{position:absolute;opacity:0;transition:opacity .5s ease;pointer-events:none;color:var(--ink)}
.panel.on{opacity:1}
#reading{left:70px;top:132px;width:1460px;--rfs:24px}
.rhead{display:grid;grid-template-columns:76px 1fr 1fr;gap:30px;padding:0 16px 6px;color:var(--muted);font-size:20px}
.rrow{display:grid;grid-template-columns:76px 1fr 1fr;gap:30px;align-items:start;padding:8px 16px;border-radius:12px;
  opacity:.35;transition:opacity .4s ease,background .4s ease,box-shadow .4s ease}
.rrow.done{opacity:.6}
.rrow.hide{display:none}
.rrow.cur{opacity:1;background:var(--paper);box-shadow:inset 5px 0 0 var(--gold)}
.rrow p{margin:0;font-size:var(--rfs);line-height:1.38}
.rrow .en{font-family:"Segoe UI",Arial,sans-serif}
.rrow .ph-text{color:var(--muted);border:2px dashed var(--line);border-radius:8px;padding:4px 10px}
.rtag{font-weight:700;font-size:20px;border:2px solid currentColor;border-radius:8px;text-align:center;padding:2px 0;margin-top:3px}
.t-CAD{color:var(--blue)} .t-CAM{color:var(--green)} .t-CAE{color:var(--gold)}
#vocab{left:110px;top:150px;width:1380px;display:grid;grid-template-columns:1fr 1.15fr;gap:60px}
.vcol{opacity:.35;transition:opacity .4s ease}
.vcol.cur{opacity:1}
.vcol h3{margin:0 0 14px;font-size:30px;color:var(--gold)}
.vcol ol{margin:0;padding-left:44px;font-size:24px;line-height:1.62}
.vcol ol.alpha{list-style:lower-alpha}
.vcol li b{font-family:"Segoe UI",Arial,sans-serif;font-weight:600;margin-right:16px}
.vcol li span{color:var(--ink)} .vcol li i{color:var(--muted);font-style:normal;font-size:18px;margin-left:10px}
.still .o,.still .a,.still .cell,.still #vlayer,.still .draw,.still .grow,.still .media{transition:none!important}
#vlayer{position:absolute;left:320px;top:110px;width:960px;height:540px;border-radius:14px;overflow:hidden;
  border:2px solid var(--line);background:#141414;opacity:0;transform:scale(.96);transition:opacity .5s ease,transform .6s ease}
#vlayer.on{opacity:1;transform:none}
#vlayer video{width:100%;height:100%;object-fit:contain;display:block}
#vph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  background:var(--paper);color:var(--muted);font-size:26px;border:3px dashed var(--line);border-radius:12px}
#vph b{color:var(--ink);font-size:30px}
#notes{position:fixed;left:0;right:0;bottom:0;padding:14px 28px calc(14px + env(safe-area-inset-bottom,0px));
  background:rgba(30,29,26,.88);color:#F4EFE3;font-size:22px;line-height:1.6;display:none;z-index:5}
#notes small{opacity:.6;margin-right:12px}
#hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:15px;transition:opacity .4s}
@media (prefers-reduced-motion: reduce){
  .o,.a,.cell,#vlayer,.draw,.grow,.media{transition-duration:.01s!important}
  .spin{animation:none}
}
</style>
</head>

<script>
/* =====================================================================
   課本重點：把課本的句子貼在反引號 ` ` 中間（取代「貼上：…」那一行）。
   en = 英文原文，zh = 課本的中文翻譯。一組 = 簡報上的一列，一個點擊。
   ===================================================================== */
const READING = [
  {tag: 'CAD', en: `Computer-aided-design (CAD) is the technology concerned with the use of computers to support the construction, alteration, analysis, and optimization of a design. Any computer program that embodies computer graphics and application program facilitating engineering functions in the design process is categorized as CAD software.`, zh: `電腦輔助設計(CAD)是使用電腦来支援設計的建構、修改、分析和最佳化的技術。任何電腦程式包含電腦繪圖功能，以及在設計過程中，能夠幫助工程設計的應用程式，都可被歸類為CAD軟體。`},
  {tag: 'CAD', en: `The most fundamental role of CAD is to define and delineate the geometry of design for mechanical parts, architecture structures, electronic circuits, building layouts, and so on.`, zh: `CAD所扮演最基本的角色就是定義和描述機械零件、建築结構、電子電路、建築物配置等幾何設計。`},
  {tag: 'CAM', en: `Computer-aided-manufacturing (CAM) is the technology related to the use of computers to plan, manage, supervise, and control of manufacturing operations via computer interface with all the production resources.`, zh: `電腦輔助製造(CAM)是經由和所有生產资源以介面速结的電腦来計畫、管理、監測與控制整個製造過程。`},
  {tag: 'CAM', en: `One of the most mature areas of CAM is computer numerical control or CNC.`, zh: `應用CAM最成熟的领域就是電腦數值控制，或者稱為CNC。`},
  {tag: 'CAM', en: `Another noteworthy CAM function is the programming of robots. Robots may perform individual task such as welding, assembling, or carrying parts in the machine shop.`, zh: `另一個值得注意的CAM功能，就是機器人程式設計，機器人可以執行工廠裡像銲接、组装、搬運等個別作業。`},
  {tag: 'CAE', en: `Computer-aided-engineering (CAE) is the technology involves using computer systems to analyze CAD geometry, Designers are, then, allowed to simulate and study the performance of various designs.`, zh: `電腦輔助工程(CAE)是使用電腦系统来分析CAD幾何技術, 設計者因此可以模擬與研究不同設計的表现。`},
  {tag: 'CAE', en: `Logic-timing software, simulating the operation of complex electronic circuits, is also a CAE tool example.`, zh: `模擬複雏電子電路操作的邏辑計時軟體，也是CAE工具的一個例子。`}
];
/* 課本 Vocabulary 與 Terminology：[英文, 中文, 詞性] */
const VOCAB = [
  ['manipulate', '處理、操作', 'v.'], ['customized', '客製化的', 'adj.'], ['subsequent', '後續的', 'adj.'],
  ['supervise', '監督', 'v.'], ['weld', '焊接', 'n./v.'], ['workcell', '小型獨立工作站', 'n.'],
  ['simulation', '模擬', 'n.'], ['refinement', '改良', 'n.'], ['kinematics', '運動學', 'n.'],
  ['linkage', '連接、聯繫、連鎖', 'n.'], ['displacement', '位移', 'n.'], ['mechanism', '機構', 'n.']
];
const TERMS = [
  ['computer-aided design (CAD)', '電腦輔助設計'], ['tolerance analysis', '公差分析'], ['finite-element modeling', '有限元素模型'],
  ['geometric design', '幾何設計'], ['electronic circuit', '電子電路'], ['computer-aided manufacturing (CAM)', '電腦輔助製造'],
  ['computer interface', '電腦介面'], ['finished part', '零件成品'], ['computer-aided engineering (CAE)', '電腦輔助工程']
];
/* ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const C = {ink:'var(--ink)', muted:'var(--muted)', line:'var(--line)', gold:'var(--gold)', blue:'var(--blue)', red:'var(--red)', green:'var(--green)', paper:'var(--paper)', bg:'var(--bg)'};

function el(name, attrs = {}, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function paint(e, {fill = 'none', stroke = null, w = 3, dash = null, cap = 'round'} = {}) {
  e.style.fill = fill;
  if (stroke) { e.style.stroke = stroke; e.style.strokeWidth = w; e.style.strokeLinecap = cap; e.style.strokeLinejoin = 'round'; }
  if (dash) e.style.strokeDasharray = dash;
  return e;
}

/* ---------- beat engine ---------- */
const items = [];
function item({x = 0, y = 0, s = 1, from = 0, to = 999, pos = null, delay = 0, op = null, cls = null}) {
  const o = el('g', {class: 'o'}, svg);
  const a = el('g', {class: 'a'}, o);
  if (cls) a.classList.add(cls);
  items.push({o, a, x, y, s, from, to, pos, delay, op});
  return a;
}

/* ---------- drawing helpers ---------- */
function text(parent, str, {x = 0, y = 0, size = 26, fill = C.ink, weight = 400, anchor = 'middle'} = {}) {
  const t = el('text', {x, y, 'font-size': size, 'font-weight': weight, 'text-anchor': anchor, 'dominant-baseline': 'central'}, parent);
  t.style.fill = fill;
  t.textContent = str;
  return t;
}
function tag(parent, str, color, {x = 0, y = 0, size = 24} = {}) {
  const g = el('g', {}, parent);
  const r = paint(el('rect', {rx: 8, ry: 8}, g), {fill: C.paper, stroke: color, w: 2});
  const t = text(g, str, {x, y, size, fill: color});
  const w = t.getComputedTextLength();
  const px = size * 0.6, h = size * 1.7;
  r.setAttribute('x', x - w / 2 - px); r.setAttribute('y', y - h / 2);
  r.setAttribute('width', w + 2 * px); r.setAttribute('height', h);
  return g;
}
function arrow(parent, x1, y1, x2, y2, color, w = 3) {
  const g = el('g', {}, parent);
  paint(el('path', {d: `M${x1} ${y1} L${x2} ${y2}`}, g), {stroke: color, w});
  const ang = Math.atan2(y2 - y1, x2 - x1), L = 14, sp = 0.45;
  const p1 = [x2 - L * Math.cos(ang - sp), y2 - L * Math.sin(ang - sp)];
  const p2 = [x2 - L * Math.cos(ang + sp), y2 - L * Math.sin(ang + sp)];
  paint(el('path', {d: `M${p1[0]} ${p1[1]} L${x2} ${y2} L${p2[0]} ${p2[1]}`}, g), {stroke: color, w});
  return g;
}
function cross(parent, cx, cy, size, color, w = 8) {
  const g = el('g', {transform: `rotate(-6 ${cx} ${cy})`}, parent);
  const h = size / 2;
  paint(el('path', {d: `M${cx - h} ${cy - h} L${cx + h} ${cy + h} M${cx + h} ${cy - h} L${cx - h} ${cy + h}`}, g), {stroke: color, w});
  return g;
}
const CAR = 'M10 85 L10 62 Q12 50 30 48 L84 44 L122 14 Q128 8 140 8 L214 8 Q228 8 238 18 L268 46 L300 52 Q312 55 312 68 L312 85 Z';
const CAR_CRUSHED = 'M52 85 L52 70 L62 62 L56 55 L90 44 L122 14 Q128 8 140 8 L214 8 Q228 8 238 18 L268 46 L300 52 Q312 55 312 68 L312 85 Z';
function car(parent, {stroke = C.muted, dash = null, crushed = false, w = 3} = {}) {
  const g = el('g', {}, parent);
  paint(el('path', {d: crushed ? CAR_CRUSHED : CAR}, g), {stroke, w, dash});
  paint(el('path', {d: crushed ? 'M128 18 L176 18 L176 42 L104 42 Z' : 'M128 18 L176 18 L176 42 L98 42 Z'}, g), {stroke, w: w - 1, dash});
  paint(el('path', {d: 'M186 18 L222 18 Q230 18 236 26 L252 42 L186 42 Z'}, g), {stroke, w: w - 1, dash});
  if (crushed) paint(el('path', {d: 'M52 70 L66 76 L54 81'}, g), {stroke, w: w - 1});
  for (const cx of [crushed ? 92 : 68, 256]) paint(el('circle', {cx, cy: 86, r: 20}, g), {fill: C.bg, stroke, w, dash});
  return g;
}
function heatCar(parent) {
  const g = el('g', {}, parent);
  const cells = el('g', {'clip-path': 'url(#carclip)'}, g);
  const stops = [[192, 68, 59], [191, 142, 34], [77, 150, 99], [58, 114, 203]];
  const mix = t => {
    const seg = Math.min(2, Math.floor(t * 3)), f = t * 3 - seg;
    const a = stops[seg], b = stops[seg + 1];
    return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * f)).join(',')})`;
  };
  let col = 0;
  for (let x = 10; x < 312; x += 13, col++) {
    for (let y = 6; y < 86; y += 13) {
      const t = Math.min(1, Math.max(0, (x - 10) / 302 + (Math.random() - 0.5) * 0.12));
      const r = el('rect', {x, y, width: 11, height: 11, rx: 2, class: 'cell'}, cells);
      r.style.fill = mix(t);
      r.style.transitionDelay = (200 + col * 40) + 'ms';
    }
  }
  car(g, {stroke: C.ink});
  return g;
}
function dummy(parent, color) {
  const g = el('g', {}, parent);
  paint(el('circle', {cx: 0, cy: -62, r: 12}, g), {stroke: color, w: 4});
  paint(el('path', {d: 'M0 -48 L0 -12 M0 -38 L-22 -22 M0 -38 L22 -22 M0 -12 L-16 18 M0 -12 L16 18'}, g), {stroke: color, w: 4});
  return g;
}
function loop(parent, cx, cy, r, color) {
  const g = el('g', {class: 'spin'}, parent);
  paint(el('circle', {cx, cy, r}, g), {stroke: color, w: 3, dash: '10 8'});
  paint(el('path', {d: `M${cx - 9} ${cy - r - 9} L${cx + 3} ${cy - r} L${cx - 9} ${cy - r + 9}`}, g), {stroke: color, w: 3});
  paint(el('path', {d: `M${cx + 9} ${cy + r - 9} L${cx - 3} ${cy + r} L${cx + 9} ${cy + r + 9}`}, g), {stroke: color, w: 3});
  return g;
}
function block(parent, label, zh, color) {
  paint(el('rect', {x: 0, y: 0, width: 340, height: 300, rx: 18}, parent), {fill: C.paper, stroke: color, w: 3});
  text(parent, label, {x: 28, y: 46, size: 40, weight: 700, fill: color, anchor: 'start'});
  text(parent, zh, {x: 28, y: 84, size: 22, fill: C.muted, anchor: 'start'});
}

/* ================= SCENES ================= */

/* B0  title */
{
  const t = item({from: 0, to: 1});
  text(t, 'CAD　CAE　CAM', {x: 800, y: 330, size: 104, weight: 700});
  tag(t, '第七組｜科技英文 Unit 15', C.gold, {x: 800, y: 445, size: 26});
  paint(el('path', {d: 'M300 530 L1300 530'}, t), {stroke: C.line, w: 2});
  [['王豐盈', 'W1134171036'], ['黃俊瑋', 'W1134171034'], ['周俊良', 'W1134171022'], ['郭登揚', 'W1134171020']].forEach(([n, id], i) => {
    const x = 425 + i * 250;
    text(t, n, {x, y: 595, size: 32, weight: 700});
    text(t, id, {x, y: 640, size: 22, fill: C.muted});
  });
  /* today's date, read from the computer's clock when the file is opened */
  const now = new Date(), wk = '日一二三四五六'[now.getDay()];
  text(t, `${now.getFullYear()} 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日（${wk}）`, {x: 800, y: 730, size: 24, fill: C.muted});
}

/* B1–B3  video + question */
{
  const q = item({from: 2, to: 4});
  text(q, '哪一邊是真的？', {x: 800, y: 58, size: 38, weight: 700});
  const l1 = item({from: 2, to: 3}); tag(l1, '左？', C.muted, {x: 560, y: 712, size: 28});
  const r1 = item({from: 2, to: 3, delay: 120}); tag(r1, '右？', C.muted, {x: 1040, y: 712, size: 28});
  const l2 = item({from: 3, to: 4}); tag(l2, '真實測試 Real test', C.blue, {x: 560, y: 712, size: 28});
  const r2 = item({from: 3, to: 4, delay: 250}); tag(r2, '電腦模擬 Simulation', C.gold, {x: 1040, y: 712, size: 28});
  const same = item({from: 3, to: 4, delay: 700}); tag(same, '變形看起來非常接近', C.green, {x: 800, y: 790, size: 24});
}

/* B4–B8  three reasons: roadmap chips */
const chipX = [560, 800, 1040], chipTxt = ['① 成本', '② 時間', '③ 看得到裡面'];
{
  const q = item({from: 4, to: 5});
  text(q, '為什麼還要做模擬？', {x: 800, y: 400, size: 64, weight: 700});
  chipTxt.forEach((s, i) => {
    const c = item({from: 4, to: 9, delay: 300 + i * 150, pos: {5: [0, -490, 1]}});
    tag(c, s, C.muted, {x: chipX[i], y: 560, size: 26});
  });
  [[5, 7], [7, 8], [8, 9]].forEach(([f, t], i) => {
    const c = item({from: f, to: t, delay: f === 5 ? 600 : 0});
    tag(c, chipTxt[i], C.gold, {x: chipX[i], y: 70, size: 26});
  });
}

/* B5  cost: real test */
{
  for (const [f, t] of [[5, 7], [8, 9]]) { const lab = item({from: f, to: t}); tag(lab, '真實測試', C.blue, {x: 400, y: 180, size: 26}); }
  const wreck = item({from: 5, to: 7, x: 120, y: 300});
  car(wreck, {stroke: C.muted, crushed: true});
  const x1 = item({from: 5, to: 7, delay: 450}); cross(x1, 300, 345, 90, C.red);
  const t1 = item({from: 5, to: 7, delay: 650}); tag(t1, '撞一次就報廢', C.red, {x: 270, y: 470});
  const d = item({from: 5, to: 7, x: 610, y: 390, delay: 900}); dummy(d, C.gold);
  const t2 = item({from: 5, to: 7, delay: 1050}); tag(t2, '可以重複使用', C.green, {x: 610, y: 470});
  const big = item({from: 5, to: 7, delay: 1400});
  text(big, '≈ US$1,000,000', {x: 400, y: 600, size: 60, weight: 700, fill: C.gold});
  tag(big, '最高階的測試假人', C.muted, {x: 400, y: 676, size: 22});
}

/* B6  cost: simulation */
{
  const div = item({from: 6, to: 7});
  paint(el('path', {d: 'M800 150 L800 720'}, div), {stroke: C.line, w: 2, dash: '8 8'});
  const lab = item({from: 6, to: 7}); tag(lab, '電腦模擬', C.gold, {x: 1200, y: 180, size: 26});
  const scr = item({from: 6, to: 7, x: 1000, y: 290, delay: 200});

  note(b + 1, '這二十幾年，有兩個改變我們覺得很重要。');
  note(b + 2, '第一個：電腦開始幫忙「想」形狀。這叫 generative design，生成式設計。');
  note(b + 3, '以前是工程師先畫好形狀，再交給 CAE 檢查。');
  note(b + 4, '現在反過來：工程師只告訴電腦，這個零件要接在哪裡、要承受多少力、用什麼材料、怎麼製造，電腦自己算出很多種形狀。');
  note(b + 5, '通用汽車和 Autodesk 用這個方法，重新設計一個座椅支架。軟體提出了一百五十多種設計。');
  note(b + 6, '他們選的那一個，原本八個零件變成一個，用 3D 列印做出來。重量輕了 40%，強度還多了 20%。');
  note(b + 7, '不過要說清楚：這是概念驗證用的零件，還不是量產的零件。');
  note(b + 8, '大家看這個形狀，是不是有點像骨頭？因為電腦只把材料放在需要受力的地方。');

/* ---------- render ---------- */
const vlayer = document.getElementById('vlayer'), vid = document.getElementById('vid'), vph = document.getElementById('vph');
const notes = document.getElementById('notes'), hint = document.getElementById('hint');
vid.addEventListener('error', () => { vph.style.display = 'flex'; });
let beat = 0, prev = 0;

function render() {
  for (const it of items) {
    const vis = beat >= it.from && beat < it.to;
    it.a.style.transitionDelay = vis && !it.a.classList.contains('on') ? it.delay + 'ms' : '0ms';
    it.a.classList.toggle('on', vis);
    let p = [it.x, it.y, it.s];
    if (it.pos) for (const k of Object.keys(it.pos).map(Number).sort((a, b) => a - b)) if (beat >= k) p = it.pos[k];
    it.o.style.transform = `translate(${p[0]}px, ${p[1]}px) scale(${p[2]})`;
    let ov = 1;
    if (it.op) for (const k of Object.keys(it.op).map(Number).sort((a, b) => a - b)) if (beat >= k) ov = it.op[k];
    it.o.style.opacity = ov;
  }
  for (const m of medias) m.d.classList.toggle('on', beat >= m.from && beat < m.to);
  for (const p of panels) { p.d.classList.toggle('on', p.vis(beat)); p.update(beat); }
  const showVid = beat >= 1 && beat <= 3;
  vlayer.classList.toggle('on', showVid);
  try {
    if (beat === 1 && prev === 0) { vid.currentTime = 0; vid.play().catch(() => {}); }
    else if (beat === 1) { vid.play().catch(() => {}); }
    else vid.pause();
  } catch (e) {}
  notes.innerHTML = `<small>${beat} / ${LAST}</small>${NOTES[beat]}`;
  prev = beat;
}
function go(d) {
  const n = Math.max(0, Math.min(LAST, beat + d));
  if (n === beat) return;
  beat = n; hint.style.opacity = 0; render();
}
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); go(1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)) { e.preventDefault(); go(-1); }
  else if (k === 'Home') { beat = 0; render(); }
  else if (k === 'n' || k === 'N') { notes.style.display = notes.style.display === 'block' ? 'none' : 'block'; }
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
});
addEventListener('click', () => go(1));

function fit() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener('resize', fit);
fit(); render();
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('still')));
